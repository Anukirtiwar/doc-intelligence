services:
  backend:
    build: ./backend
    container_name: docintel-backend
    restart: always
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: docintel-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
