services:
  backend:
    build: ./backend
    container_name: docintel-backend
    restart: always
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
    # Remove the "ports" section so it's only accessible internally
    expose:
      - "8000"

  frontend:
    build: ./frontend
    container_name: docintel-frontend
    restart: always
    # Remove the "ports" section
    expose:
      - "3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: docintel-nginx
    restart: always
    ports:
      - "3000:80" # We expose Nginx on port 3000 locally
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend